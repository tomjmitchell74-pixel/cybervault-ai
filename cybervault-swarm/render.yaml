services:
  - type: web
    name: cybervault-swarm
    runtime: python
    region: ohio
    plan: free
    buildCommand: pip install -r swarm/requirements.txt
    startCommand: uvicorn swarm.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: SWARM_TOKEN
        sync: false
